[project]
name = "gestorcom"
version = "1.0.0"
description = "Sistema de gestão de comissões para equipes de vendas"
requires-python = ">=3.12"
dependencies = [
    "asgiref>=3.8.1",
    "click>=8.1.8",
    "colorama>=0.4.6",
    "Django>=5.1.6,<6.0",
    "gunicorn>=23.0.0",
    "h11>=0.14.0",
    "packaging>=24.2",
    "psycopg2-binary>=2.9.9",
    "python-decouple>=3.8",
    "sqlparse>=0.5.3",
    "tzdata>=2025.1",
    "uvicorn>=0.34.0",
    "waitress>=3.0.2",
    "whitenoise>=6.9.0",
]

[project.scripts]
manage = "manage:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "coverage>=7.4",
]
